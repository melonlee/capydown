name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # .npmrc 指向国内镜像（方便本地开发）；CI 在海外，删掉它，依赖和 Electron 都走官方源
      - name: Use official registries
        shell: bash
        run: rm -f .npmrc

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # 说明：`pnpm lint` 和 `pnpm typecheck` 目前在历史代码（主要是默认关闭的实验模块）上仍有存量问题，
      # 清理完成后再加入 CI。
