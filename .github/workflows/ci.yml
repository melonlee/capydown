name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # .npmrc 里的国内镜像方便本地开发；CI 在海外，只去掉镜像两行，改走官方源。
      # 其余设置（shamefully-hoist 等）必须保留：没有它 electron-builder 会漏打间接依赖（如 electron-store → conf）
      - name: Use official registries
        shell: bash
        run: sed -i.bak -E '/^(electron_mirror|registry)=/d' .npmrc && rm -f .npmrc.bak && cat .npmrc

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # 说明：`pnpm lint` 和 `pnpm typecheck` 目前在历史代码（主要是默认关闭的实验模块）上仍有存量问题，
      # 清理完成后再加入 CI。
