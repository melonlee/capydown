name: Release

# 推送 v* 标签时，构建 macOS / Windows / Linux 安装包并上传到 GitHub Release（草稿）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # .npmrc 里的国内镜像方便本地开发；CI 在海外，只去掉镜像两行，改走官方源。
      # 其余设置（shamefully-hoist 等）必须保留：没有它 electron-builder 会漏打间接依赖（如 electron-store → conf）
      - name: Use official registries
        shell: bash
        run: sed -i.bak -E '/^(electron_mirror|registry)=/d' .npmrc && rm -f .npmrc.bak && cat .npmrc

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package and upload
        run: pnpm exec electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 还没有 Apple Developer 证书：跳过签名。拿到证书后配置 CSC_LINK / CSC_KEY_PASSWORD /
          # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID，并在 electron-builder.yml 中开启 notarize
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # 打包产物冒烟测试：用 Electron 直接加载安装包里的 app.asar，主进程缺模块等加载错误会让任务失败。
      # （上传发生在上一步，Release 是草稿；此步失败就不要发布这个草稿）
      - name: Smoke test packaged app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # 拷到项目目录之外再加载：否则 Node 会向上找到项目自己的 node_modules，掩盖安装包里缺失的依赖
          APP=$(ls -d dist/mac*/LazyBox.app | head -1)
          cp -R "$APP" "$RUNNER_TEMP/LazyBox.app"
          npx electron "$RUNNER_TEMP/LazyBox.app/Contents/Resources/app.asar" > smoke.log 2>&1 &
          PID=$!
          sleep 20
          kill $PID 2>/dev/null || true
          cat smoke.log
          if grep -E -q "App threw an error|Cannot find module|ERR_REQUIRE_ESM" smoke.log; then exit 1; fi
          grep -q "AI IPC handlers initialized" smoke.log
