name: Release

# 推送 v* 标签时，构建 macOS / Windows / Linux 安装包并上传到 GitHub Release（草稿）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # .npmrc 里的国内镜像方便本地开发；CI 在海外，只去掉镜像两行，改走官方源。
      # 其余设置（shamefully-hoist 等）必须保留：没有它 electron-builder 会漏打间接依赖（如 electron-store → conf）
      - name: Use official registries
        shell: bash
        run: sed -i.bak -E '/^(electron_mirror|registry)=/d' .npmrc && rm -f .npmrc.bak && cat .npmrc

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package and upload
        run: pnpm exec electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 还没有 Apple Developer 证书：跳过签名。拿到证书后配置 CSC_LINK / CSC_KEY_PASSWORD /
          # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID，并在 electron-builder.yml 中开启 notarize
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # 打包产物检查：解出安装包里的 app.asar，用 Electron 自带的 Node（ELECTRON_RUN_AS_NODE，无需图形界面）
      # 加载主进程与 preload 代码。漏打 / 错打的依赖（Cannot find module、ERR_REQUIRE_ESM）会让任务失败。
      # 解到项目目录之外，避免 Node 向上找到仓库自己的 node_modules 而掩盖问题。
      # （上传发生在上一步，Release 是草稿；此步失败就不要发布这个草稿）
      - name: Check packaged app bundle
        shell: bash
        run: |
          # find instead of ls globs: the job shell runs with -e -o pipefail, so an unmatched glob would abort it
          ASAR=$(find dist \( -path '*/resources/app.asar' -o -path '*/Resources/app.asar' \) -print -quit)
          [ -n "$ASAR" ] || { echo "app.asar not found under dist/"; exit 1; }
          echo "checking $ASAR"
          npx --yes @electron/asar extract "$ASAR" "$RUNNER_TEMP/app"
          ELECTRON_RUN_AS_NODE=1 "$(node -p "require('electron')")" scripts/ci/check-bundle.mjs "$RUNNER_TEMP/app"
