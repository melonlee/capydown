<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="keywords" content="md,markdown,markdown-editor,LazyBox" />
    <meta name="description" content="LazyBox | 公众号 Markdown 写作与排版桌面应用" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <title>LazyBox · 懒排</title>
    <style>
      html, body { margin: 0; background: #ffffff; }
      .loading {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
      }
      .loading::before {
        content: url('/src/assets/images/logo-mark.svg');
        width: 64px;
        height: 64px;
        opacity: 0.14;
      }
      html.lb-boot-dark, html.lb-boot-dark body, html.lb-boot-dark .loading { background: #1e1e1e; }
      html.lb-boot-dark .loading::before { filter: invert(1); }
    </style>
    <script>
      // 启动画面与即将应用的编辑器主题一致（Night 或跟随系统的深色）
      try {
        const theme = (localStorage.getItem('lb-editor-theme') || '"github"').replace(/"/g, '')
        const follow = localStorage.getItem('lb-follow-system') !== 'false'
        const dark = theme === 'night' || (follow && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('lb-boot-dark')
      } catch {}
    </script>
  </head>

  <body>
    <noscript>
      <strong>Please enable JavaScript to continue.</strong>
    </noscript>
    <div id="app">
      <div class="loading"></div>
    </div>
    <script>
      window.MathJax = {
        loader: { load: ['[tex]/ams'] },
        tex: { packages: { '[+]': ['ams'] }, tags: 'ams' },
        svg: { fontCache: 'none' },
      }
    </script>
    <script id="MathJax-script" src="https://cdn-doocs.oss-cn-shenzhen.aliyuncs.com/npm/mathjax@3/es5/tex-svg.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
