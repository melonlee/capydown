<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="keywords" content="md,markdown,markdown-editor,Slothdown" />
    <meta name="description" content="Slothdown · 给公众号作者的 Markdown 编辑器" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <title>Slothdown</title>
    <script>
      // 启动画面与即将应用的编辑器主题一致（Night 或跟随系统的深色 → 灰阶反相；Newsprint → 米色纸）
      try {
        const theme = (localStorage.getItem('lb-editor-theme') || '"github"').replace(/"/g, '')
        const follow = localStorage.getItem('lb-follow-system') !== 'false'
        const dark = theme === 'night' || (follow && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('lb-boot-dark')
        else if (theme === 'newsprint') document.documentElement.classList.add('lb-boot-paper')
      } catch {}
    </script>
    <style>
      /*
       * 启动画面：树懒标志落定 → Slothdown 字标淡入 → 墨线从笔尖画出、成为字标下的横线 → 一句话介绍 → 淡出到应用。
       * 和图标同一个故事（抱着钢笔打盹的树懒，笔尖拖出一道墨线）。纯 CSS / SVG 动画，时间轴 1.0 s，退场 0.2 s；
       * 应用就绪得早就加速播完，就绪得晚就停在最后一帧。控制逻辑见本文件底部的脚本；
       * 渲染进程挂载完成后调用 window.__lbSplash.ready()（utils/boot.ts）。
       * 标志与字标是内联 SVG（logo-mark.svg / logo-wordmark-light.svg 的路径，只用 currentColor），不依赖字体加载。
       */
      /* 启动期间的窗口底色；App.vue 应用主题后会去掉 lb-boot-* 类 */
      html, body { margin: 0; background: #ffffff; }
      html.lb-boot-paper, html.lb-boot-paper body { background: #f6f6f3; }
      html.lb-boot-dark, html.lb-boot-dark body { background: #1e1e1e; }

      /* 配色固定在启动画面元素上（启动脚本复制 lb-boot-* 到 is-*），主题提前应用也不会中途变色 */
      .lb-splash { --sp-bg: #ffffff; --sp-fg: #111111; --sp-ink: #111111; --sp-muted: #8a8a8a; }
      .lb-splash.is-paper { --sp-bg: #f6f6f3; --sp-muted: #84847f; }
      .lb-splash.is-dark { --sp-bg: #1e1e1e; --sp-fg: #ededed; --sp-ink: #d6d6d6; --sp-muted: #8c8c8c; }

      .lb-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--sp-bg);
        color: var(--sp-fg);
        cursor: default;
        user-select: none;
        -webkit-user-select: none;
        -webkit-app-region: drag; /* 无边框标题栏：启动期间也能拖动窗口 */
        -webkit-font-smoothing: antialiased;
      }
      .lb-splash-stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        transform: translateY(-3vh); /* 视觉中心略高于几何中心 */
      }
      /* 组合标志：[标志 56] 14 [字标 34 高]，墨线叠在上面；坐标与下面 SVG 的 viewBox 一致（285 × 64） */
      .lb-splash-lockup { position: relative; width: 285px; height: 64px; }
      .lb-splash-lockup svg { position: absolute; display: block; overflow: visible; }
      .lb-splash-mark { left: 0; top: 0; width: 56px; height: 56px; will-change: transform, opacity; }
      .lb-splash-word { left: 70px; top: 11px; width: 215px; height: 34px; will-change: transform, opacity; }
      .lb-splash-ink { left: 0; top: 0; width: 285px; height: 64px; }
      .lb-splash-ink path {
        fill: none;
        stroke: var(--sp-ink);
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-dasharray: 300;
        stroke-dashoffset: 300; /* 路径长约 285，留一点余量 */
      }
      .lb-splash-tag {
        margin: 22px 0 0;
        font: 400 13px/1.5 -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;
        letter-spacing: 0.04em;
        color: var(--sp-muted);
      }

      /* 初始状态：脚本加上 .is-playing 之前什么都不显示（窗口可见后才开始播放） */
      .lb-splash-mark, .lb-splash-word, .lb-splash-tag { opacity: 0; }

      /* ---------------------------------------------------------------- 时间轴（ms）
       *    0–420  标志上浮落定（淡入 + 轻微放大）
       *  220–600  字标从左侧滑入、去模糊
       *  440–900  墨线从笔尖画出，沿字标下方展开成一道「~」
       *  760–1000 一句话介绍淡入
       */
      .is-playing .lb-splash-mark { animation: lb-sp-settle 420ms cubic-bezier(0.22, 1, 0.36, 1) both; }
      .is-playing .lb-splash-word { animation: lb-sp-word 380ms cubic-bezier(0.22, 1, 0.36, 1) 220ms both; }
      .is-playing .lb-splash-ink path { animation: lb-sp-draw 460ms cubic-bezier(0.65, 0, 0.35, 1) 440ms both; }
      .is-playing .lb-splash-tag { animation: lb-sp-rise 240ms cubic-bezier(0.22, 1, 0.36, 1) 760ms both; }

      @keyframes lb-sp-settle {
        from { opacity: 0; transform: translateY(8px) scale(0.94); }
        to { opacity: 1; transform: none; }
      }
      @keyframes lb-sp-word {
        from { opacity: 0; transform: translateX(-8px); filter: blur(2px); }
        to { opacity: 1; transform: none; filter: blur(0); }
      }
      @keyframes lb-sp-draw { from { stroke-dashoffset: 300; } to { stroke-dashoffset: 0; } }
      @keyframes lb-sp-rise {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes lb-sp-fade { from { opacity: 0; } to { opacity: 1; } }

      /* 退场：整体淡出，舞台轻微上移（交叉淡入到下面已经画好的界面） */
      .lb-splash.is-leaving { pointer-events: none; transition: opacity 200ms ease-out; opacity: 0; }
      .lb-splash.is-leaving .lb-splash-stage { transition: transform 200ms ease-in; transform: translateY(calc(-3vh - 6px)); }

      /* 减少动态效果：直接显示最终画面（墨线已画好），只做淡入淡出 */
      @media (prefers-reduced-motion: reduce) {
        .lb-splash-ink path { stroke-dashoffset: 0; }
        .is-playing .lb-splash-mark,
        .is-playing .lb-splash-word,
        .is-playing .lb-splash-tag { animation: lb-sp-fade 160ms ease-out both; }
        .is-playing .lb-splash-ink path { animation: none; }
        .lb-splash-ink { opacity: 0; }
        .is-playing .lb-splash-ink { animation: lb-sp-fade 160ms ease-out both; }
        .lb-splash.is-leaving .lb-splash-stage { transition: none; transform: translateY(-3vh); }
      }
    </style>
  </head>

    <script>
      // 启动画面控制：窗口可见后开始播放；应用就绪（ready）后播完并淡出。
      ;(function () {
        const el = document.getElementById('lb-splash')
        const root = document.documentElement
        if (root.classList.contains('lb-boot-dark')) el.classList.add('is-dark')
        else if (root.classList.contains('lb-boot-paper')) el.classList.add('is-paper')
        const SEQUENCE_MS = 1000 // 时间轴总长（与上面 CSS 的最后一个动画结束时间一致）
        const LEAVE_MS = 200 // 整体淡出
        const MAX_CATCHUP_MS = 250 // 就绪时剩余的动画最多再播这么久（必要时加速）
        const SAFETY_MS = 10000 // 应用始终没有就绪（例如脚本出错）时也撤掉遮罩，别挡住界面
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches
        let startedAt = 0
        let readyCalled = false
        let leaving = false
        const marks = {} // 各阶段时间点（performance.now()），供端到端测试检查

        function play() {
          if (startedAt) return
          startedAt = marks.start = performance.now()
          el.classList.add('is-playing')
          if (readyCalled) finish()
        }

        function leave() {
          if (leaving) return
          leaving = true
          marks.leave = performance.now()
          el.classList.add('is-leaving')
          setTimeout(() => el.remove(), (reduced ? 200 : LEAVE_MS) + 40)
        }

        function finish() {
          if (reduced) return leave()
          const remaining = SEQUENCE_MS - (performance.now() - startedAt)
          if (remaining <= 0) return leave()
          // 剩余部分加速播完，但不超过 3 倍速，避免看起来像跳帧
          const rate = Math.min(3, Math.max(1, remaining / MAX_CATCHUP_MS))
          if (rate > 1 && el.getAnimations) {
            for (const a of el.getAnimations({ subtree: true })) a.playbackRate = rate
          }
          setTimeout(leave, remaining / rate)
        }

        window.__lbSplash = {
          marks,
          /** 应用已挂载并完成首次渲染 */
          ready() {
            if (readyCalled) return
            readyCalled = true
            marks.ready = performance.now()
            if (startedAt) finish()
          },
        }

        // show: false 的窗口在 ready-to-show 之前处于 hidden 状态；可见后再开始，避免用户错过开头
        if (document.visibilityState === 'visible') requestAnimationFrame(play)
        else document.addEventListener('visibilitychange', function onVis() {
          if (document.visibilityState !== 'visible') return
          document.removeEventListener('visibilitychange', onVis)
          requestAnimationFrame(play)
        })
        // 兜底：可见性事件没来（个别平台）也要开始播放
        setTimeout(play, 1500)
        setTimeout(leave, SAFETY_MS)
      })()
    </script>
