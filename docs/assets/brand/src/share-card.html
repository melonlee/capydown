<!doctype html>
<!-- Link share card (Open Graph) · 1200×630 -->
<html lang="zh-CN"><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<style>
  body { width: 1200px; height: 630px; }
  .right { position: absolute; left: 700px; top: 72px; width: 440px; display: flex; flex-direction: column; }
  .lockup { height: 36px; align-self: flex-start; }
  h1 { margin-top: 52px; font-size: 46px; line-height: 1.3; white-space: nowrap; }
  .sub { margin-top: 22px; font-size: 18px; line-height: 1.7; color: var(--muted); }
  .foot { position: absolute; left: 700px; bottom: 44px; font-size: 14px; color: var(--muted); letter-spacing: .04em; }
  /* the capybara peeks up in the bottom-right corner */
  .peek { position: absolute; right: 44px; bottom: 34px; width: 176px; }
  .shot { position: absolute; left: -300px; top: 72px; }
</style></head>
<body>
  <div class="right">
    <img class="lockup" src="../logo-lockup-light.svg" alt="Capydown">
    <h1 class="serif">淡定地写，<br>排版交给卡皮巴拉。</h1>
    <p class="sub">像 Typora 一样专心写 Markdown，<br>一键排成公众号，发布前让 AI 再校对一遍。</p>
  </div>
  <p class="foot">免费开源 · macOS / Windows / Linux</p>
  <img class="peek" src="../capybara-art.svg" alt="">
  <!-- proofreading panel; the window bleeds off the left and bottom edges -->
  <div class="shot win">
    <div class="crop" style="--x:0; --y:0; --w:1440; --h:900; --cw:920"><img src="../../screenshots/08-proofread.png"></div>
  </div>
</body></html>
