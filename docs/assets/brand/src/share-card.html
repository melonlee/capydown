<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<style>
  body { width: 1200px; height: 630px; position: relative; }
  .left { position: absolute; left: 72px; top: 0; bottom: 0; width: 600px; display: flex; flex-direction: column; justify-content: center; z-index: 2; }
  .logo { height: 58px; align-self: flex-start; margin-bottom: 34px; }
  h1 { font-size: 56px; font-weight: 700; line-height: 1.25; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #C4B5FD, #8B5CF6); -webkit-background-clip: text; color: transparent; }
  p.sub { margin-top: 20px; font-size: 22px; color: var(--muted); line-height: 1.65; }
  .chips { margin-top: 30px; display: flex; gap: 10px; flex-wrap: wrap; }
  .phone { position: absolute; width: 270px; height: 500px; border-radius: 36px; background: #05060f; padding: 10px; box-shadow: 0 30px 70px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.1); }
  .phone .screen { width: 100%; height: 100%; border-radius: 27px; overflow: hidden; background: #f3f3f6; }
  .phone img { width: 100%; display: block; }
  .p1 { left: 700px; top: 92px; transform: rotate(-6deg); }
  .p2 { left: 880px; top: 60px; transform: rotate(5deg); }
</style></head>
<body class="bg-dark grid">
  <div class="left">
    <img class="logo" src="../logo-wordmark-dark.svg" alt="LazyBox">
    <h1>写 Markdown，<br><em>排出好看的公众号。</em></h1>
    <p class="sub">本地写作 · 一键换主题 · 图片上传图床<br>复制后到公众号后台粘贴，样式一并带过去</p>
    <div class="chips"><span class="pill">开源免费</span><span class="pill">桌面应用</span><span class="pill">github.com/melonlee/LazyBox</span></div>
  </div>
  <div class="phone p1"><div class="screen"><img src="crops/preview-classic.jpg"></div></div>
  <div class="phone p2"><div class="screen"><img src="crops/preview-green.jpg"></div></div>
</body></html>
