<!doctype html>
<!-- Link share card (Open Graph) · 1200×630 -->
<html lang="zh-CN"><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<style>
  body { width: 1200px; height: 630px; }
  .left { position: absolute; left: 700px; top: 76px; bottom: 72px; width: 440px; display: flex; flex-direction: column; }
  .lockup { height: 36px; align-self: flex-start; }
  h1 { margin-top: 56px; font-size: 48px; line-height: 1.32; }
  .sub { margin-top: 24px; font-size: 18px; line-height: 1.7; color: var(--muted); }
  .foot { margin-top: auto; display: flex; gap: 22px; font-size: 14px; color: var(--muted); letter-spacing: .04em; }
  .foot span + span::before { content: ""; display: inline-block; width: 1px; height: 11px; background: #cfcfcf; margin-right: 22px; vertical-align: -1px; }
  .shot { position: absolute; left: -300px; top: 76px; }
</style></head>
<body>
  <div class="left">
    <img class="lockup" src="../logo-lockup-light.svg" alt="LazyBox · 懒排">
    <h1 class="serif">写作归写作，<br>排版交给懒排。</h1>
    <p class="sub">所见即所得的 Markdown 编辑器，<br>一键排成公众号，发布前让 AI 再校对一遍。</p>
    <div class="foot"><span>免费开源</span><span>macOS · Windows · Linux</span></div>
  </div>
  <!-- proofreading panel; the window bleeds off the left and bottom edges -->
  <div class="shot win">
    <div class="crop" style="--x:0; --y:0; --w:1440; --h:900; --cw:920"><img src="../../screenshots/08-proofread.png"></div>
  </div>
</body></html>
