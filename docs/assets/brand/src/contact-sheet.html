<!doctype html>
<!-- Capydown 品牌检查表：单色标志（卡皮巴拉正面头像）在 16–512 px、浅色 / 深色背景下的可读性，字标、组合标志、应用图标（完整 / 只留头的小尺寸版）、吉祥物（从底边探出头的卡皮巴拉）。 -->
<html><head><meta charset="utf-8"><style>
body{margin:0;font:12px -apple-system,sans-serif;color:#888}
.band{display:flex;align-items:flex-end;gap:36px;padding:36px 40px}
.light{background:#fff}.paper{background:#f6f6f3}.dark{background:#1e1e1e}
.band img{display:block}.cap{margin-top:8px;text-align:center}
.wide{display:flex;gap:56px;align-items:center;padding:36px 40px}
</style></head><body>
<div class="band light" id="l"></div>
<div class="band dark" id="d"></div>
<div class="wide light"><img src="../logo-lockup-light.svg" height="64"><img src="../logo-lockup-icon-light.svg" height="72"><img src="../logo-wordmark-light.svg" height="40"></div>
<div class="wide dark"><img src="../logo-lockup-dark.svg" height="64"><img src="../logo-lockup-icon-dark.svg" height="72"><img src="../logo-wordmark-dark.svg" height="40"></div>
<div class="band paper" id="i"></div>
<div class="wide light"><img src="../capybara-art.svg" height="200"></div>
<div class="wide dark"><img src="../capybara-art-dark.svg" height="200"></div>
<script>
const sizes=[16,32,64,128,512]
for (const [id,f] of [['l','../logo-mark.svg'],['d','../logo-mark-dark.svg']])
  document.getElementById(id).innerHTML=sizes.map(s=>`<div><img src="${f}" width="${s}" height="${s}"><div class="cap">${s}</div></div>`).join('')
document.getElementById('i').innerHTML=[16,32,64,128,256].map(s=>`<div><img src="app-icon.svg" width="${s}" height="${s}"><div class="cap">${s}</div></div>`).join('')+[16,32,48].map(s=>`<div><img src="app-icon-small.svg" width="${s}" height="${s}"><div class="cap">small ${s}</div></div>`).join('')
</script></body></html>
