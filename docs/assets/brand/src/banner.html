<!doctype html>
<!-- README hero · 1280×400 -->
<html lang="zh-CN"><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<style>
  body { width: 1280px; height: 400px; }
  .left { position: absolute; left: 88px; top: 0; bottom: 0; width: 540px; display: flex; flex-direction: column; justify-content: center; }
  .lockup { height: 40px; width: auto; align-self: flex-start; }
  h1 { margin-top: 38px; font-size: 38px; line-height: 1.42; }
  .sub { margin-top: 18px; font-size: 16px; line-height: 1.6; color: var(--muted); }
  /* the mascot (a capybara coiled into a capital C, a pup on its top terminal) sits between the copy and the app window */
  .peek { position: absolute; left: 468px; bottom: 26px; width: 164px; z-index: 2; }
  .shot { position: absolute; left: 676px; top: 100px; z-index: 1; }
</style></head>
<body>
  <div class="left">
    <img class="lockup" src="../logo-lockup-light.svg" alt="Capydown">
    <h1 class="serif">像 Typora 一样专心写，<br>一键排成公众号。</h1>
    <p class="sub">给公众号作者的 Markdown 编辑器<br>发布前 AI 校对 · 导出 PDF / Word · 免费开源</p>
  </div>
  <img class="peek" src="../capybara-art.svg" alt="">
  <!-- bleeds off the right and bottom edges on purpose -->
  <div class="shot win">
    <div class="crop" style="--x:0; --y:0; --w:1060; --h:700; --cw:720"><img src="../../screenshots/01-writing.png"></div>
  </div>
</body></html>
