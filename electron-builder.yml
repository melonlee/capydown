# appId 沿用改名前的值：改了 macOS 会把它当成另一个应用（权限授权、文件关联都要重来），Windows 安装程序也认不出旧版本
appId: com.lazybox.app
productName: Slothdown
copyright: Copyright © 2025-2026 melonlee
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!docs/*'
  - '!website/**'
  - '!tests/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{vitest.config.ts,doocs.vite.config.ts,eslint.config.mjs,components.json,uno.config.ts,tailwind.config.cjs,postcss.config.mjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,README.en.md,CLAUDE.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,pnpm-workspace.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
# 注册为 Markdown 的打开方式（右键 → 打开方式 → Slothdown）。
# macOS 用 Alternate：出现在「打开方式」里，但不抢系统默认应用；Windows 由 NSIS 安装程序写注册表；Linux 写进 .desktop 的 MimeType
fileAssociations:
  - ext: [md, markdown, mdown, mkd, mkdn]
    name: Markdown Document
    description: Markdown 文档
    role: Editor
    mimeType: text/markdown
    rank: Alternate
win:
  executableName: Slothdown
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  category: public.app-category.productivity
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # extendInfo 必须是映射（写成列表时 electron-builder 会静默忽略）
  extendInfo:
    NSDocumentsFolderUsageDescription: 懒得排需要访问“文稿”文件夹来读写你的文章。
    NSDownloadsFolderUsageDescription: 懒得排需要访问“下载”文件夹来打开或导出文件。
  # 目前没有 Apple Developer 证书：不签名、不公证
  identity: null
  notarize: false
dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
linux:
  executableName: slothdown
  icon: build/icons
  desktop:
    Name: 懒得排 · Slothdown
    GenericName: Markdown 编辑器
    Comment: 像 Typora 一样专心写，一键排成公众号
  target:
    - AppImage
    - deb
  maintainer: melonlee <https://github.com/melonlee>
  category: Office
  mimeTypes:
    - text/markdown
  synopsis: 懒得排 · Slothdown — Markdown 写作与公众号排版
appImage:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
deb:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
npmRebuild: false
# electron-updater 读取的发布源（应用内目前尚未启用自动更新）
publish:
  provider: github
  owner: melonlee
  repo: slothdown
  releaseType: draft
